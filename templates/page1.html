<!DOCTYPE html>
<html>
<head>
    <title>Crime Insight Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            font-family: Arial, sans-serif;
        }

        .main-card {
            border-radius: 15px;
        }

        .analysis-card {
            border-radius: 15px;
            animation: fadeIn 0.6s ease-in-out;
        }

        .analysis-text {
            white-space: pre-line;
            line-height: 1.8;
            font-size: 15px;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(15px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .navbar {
            border-radius: 0 0 15px 15px;
        }
    </style>
</head>

<body>

<!-- 🔹 Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand mb-0 h1">Crime Insight Analyzer</span>
    <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<div class="container mt-5">

    <!-- 🔹 Search Section -->
    <div class="card shadow-lg p-4 main-card mb-4">
        <h4 class="mb-3">Ask About Crime Data</h4>

        <form method="POST">
            <div class="input-group">
                <input type="text"
                       name="query"
                       class="form-control"
                       placeholder="Example: What crimes happened in Chennai?"
                       required>

                <button type="submit" class="btn btn-dark">
                    Analyze
                </button>
            </div>
        </form>
    </div>

    <!-- 🔹 Result Section -->
    {% if result %}
    <div class="card shadow-lg p-4 analysis-card">
        <h5 class="mb-3 text-primary">📊 AI Crime Analysis Report</h5>
        <hr>

        <div class="analysis-text">
            {{ result }}
        </div>
    </div>
    {% endif %}

</div>

<!-- 🔹 Loading Script -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.querySelector("form");

    if (form) {
        form.addEventListener("submit", function() {
            const button = form.querySelector("button");
            button.innerHTML = "Analyzing...";
            button.disabled = true;
        });
    }
});
</script>

</body>
</html>
